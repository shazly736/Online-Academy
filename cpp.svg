<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#092540"/>
      <stop offset="100%" stop-color="#004481"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- Tech Grid Background Pattern -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <path d="M 0,50 H 800 M 0,100 H 800 M 0,150 H 800 M 0,200 H 800 M 0,250 H 800 M 0,300 H 800 M 0,350 H 800 M 0,400 H 800" />
    <path d="M 100,0 V 450 M 200,0 V 450 M 300,0 V 450 M 400,0 V 450 M 500,0 V 450 M 600,0 V 450 M 700,0 V 450" />
  </g>

  <!-- Glow Effect -->
  <circle cx="400" cy="180" r="150" fill="#00599c" opacity="0.35" filter="blur(40px)"/>
  <circle cx="450" cy="180" r="100" fill="#00b4d8" opacity="0.25" filter="blur(30px)"/>

  <!-- C++ Hexagon Shield & Letters -->
  <g transform="translate(400, 180)" filter="url(#shadow)">
    <!-- Hexagon -->
    <polygon points="0,-75 65,-38 65,38 0,75 -65,38 -65,-38" fill="#004482" stroke="#659ad2" stroke-width="4"/>
    <!-- C Letter -->
    <text x="-16" y="28" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="80" fill="#ffffff">C</text>
    <!-- Plus Plus symbols -->
    <g transform="translate(24, -10)">
      <!-- First Plus -->
      <path d="M -2 -14 H 6 V -6 H 14 V 2 H 6 V 10 H -2 V 2 H -10 V -6 H -2 Z" fill="#00b4d8"/>
      <!-- Second Plus -->
      <path d="M 18 2 H 26 V 10 H 34 V 18 H 26 V 26 H 18 V 18 H 10 V 10 H 18 Z" fill="#16d8cf"/>
    </g>
  </g>

  <!-- Typography -->
  <text x="400" y="360" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="34" fill="#ffffff" letter-spacing="1">C++ PROGRAMMING</text>
  <text x="400" y="395" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="16" fill="#16d8cf" letter-spacing="4">SYSTEMS &amp; ALGORITHMS</text>
</svg>
