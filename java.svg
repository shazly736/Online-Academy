<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f1a"/>
      <stop offset="50%" stop-color="#2d1b28"/>
      <stop offset="100%" stop-color="#461f26"/>
    </linearGradient>
    <linearGradient id="javaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f89820"/>
      <stop offset="100%" stop-color="#5382a1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- Tech Grid Background Pattern -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <path d="M 0,50 H 800 M 0,100 H 800 M 0,150 H 800 M 0,200 H 800 M 0,250 H 800 M 0,300 H 800 M 0,350 H 800 M 0,400 H 800" />
    <path d="M 100,0 V 450 M 200,0 V 450 M 300,0 V 450 M 400,0 V 450 M 500,0 V 450 M 600,0 V 450 M 700,0 V 450" />
  </g>

  <!-- Glow Effect -->
  <circle cx="400" cy="190" r="150" fill="#f89820" opacity="0.22" filter="blur(40px)"/>

  <!-- Java Coffee Cup Icon -->
  <g transform="translate(400, 180)" filter="url(#shadow)">
    <!-- Steam -->
    <path d="M -20 -70 C -10 -55 -30 -40 -20 -25" stroke="#f89820" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M 0 -80 C 12 -65 -8 -50 4 -30" stroke="#f89820" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M 22 -72 C 32 -58 12 -42 24 -28" stroke="#f89820" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.85"/>

    <!-- Cup Body -->
    <path d="M -50 -10 L 50 -10 C 50 40 30 65 0 65 C -30 65 -50 40 -50 -10 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Handle -->
    <path d="M 45 0 C 75 0 75 45 40 45" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.95"/>
    <!-- Saucer -->
    <path d="M -65 75 Q 0 85 65 75" stroke="#5382a1" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Typography -->
  <text x="400" y="360" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="34" fill="#ffffff" letter-spacing="1">JAVA</text>
  <text x="400" y="395" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="16" fill="#16d8cf" letter-spacing="4">OBJECT ORIENTED</text>
</svg>
