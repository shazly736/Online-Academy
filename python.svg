<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#0e2a47"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="pythonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3776ab"/>
      <stop offset="100%" stop-color="#4B8BBE"/>
    </linearGradient>
    <linearGradient id="pythonYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd43b"/>
      <stop offset="100%" stop-color="#ffe873"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- Tech Grid Background Pattern -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <path d="M 0,50 H 800 M 0,100 H 800 M 0,150 H 800 M 0,200 H 800 M 0,250 H 800 M 0,300 H 800 M 0,350 H 800 M 0,400 H 800" />
    <path d="M 100,0 V 450 M 200,0 V 450 M 300,0 V 450 M 400,0 V 450 M 500,0 V 450 M 600,0 V 450 M 700,0 V 450" />
  </g>

  <!-- Decorative Glow -->
  <circle cx="400" cy="200" r="160" fill="#3776ab" opacity="0.2" filter="blur(40px)"/>
  <circle cx="430" cy="230" r="140" fill="#ffd43b" opacity="0.15" filter="blur(40px)"/>

  <!-- Python Icon Center Badge -->
  <g transform="translate(400, 195) scale(1.15)" filter="url(#shadow)">
    <!-- Top Blue Half -->
    <path d="M -7.5 -70 C -52.5 -70 -50 -35 -50 -35 L -50 -15 L 0 -15 L 0 -3 C 0 5 -7 12 -15 12 L -50 12 C -68 12 -80 25 -80 43 C -80 62 -65 72 -47 72 L -32 72 L -32 50 C -32 32 -18 20 0 20 L 35 20 C 50 20 62 8 62 -7 L 62 -35 C 62 -62 38 -70 -7.5 -70 Z M -28 -52 C -22 -52 -18 -48 -18 -42 C -18 -36 -22 -32 -28 -32 C -34 -32 -38 -36 -38 -42 C -38 -48 -34 -52 -28 -52 Z" fill="url(#pythonBlue)"/>
    <!-- Bottom Yellow Half -->
    <path d="M 7.5 70 C 52.5 70 50 35 50 35 L 50 15 L 0 15 L 0 3 C 0 -5 7 -12 15 -12 L 50 -12 C 68 -12 80 -25 80 -43 C 80 -62 65 -72 47 -72 L 32 -72 L 32 -50 C 32 -32 18 -20 0 -20 L -35 -20 C -50 -20 -62 -8 -62 7 L -62 35 C -62 62 -38 70 7.5 70 Z M 28 52 C 22 52 18 48 18 42 C 18 36 22 32 28 32 C 34 32 38 36 38 42 C 38 48 34 52 28 52 Z" fill="url(#pythonYellow)"/>
  </g>

  <!-- Typography -->
  <text x="400" y="360" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="34" fill="#ffffff" letter-spacing="1">PYTHON</text>
  <text x="400" y="395" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="16" fill="#16d8cf" letter-spacing="4">CORE &amp; ADVANCED</text>
</svg>
